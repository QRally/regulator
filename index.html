<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeoStamp Live Tracker Master</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #050505;
            --card-bg: #111;
            --accent: #f1c40f;
            --text: #eee;
            --safe: #2ecc71;
            --danger: #e74c3c;
            --border: #222;
        }
        * { box-sizing: border-box; }
        body {
            font-family: monospace;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 40vh;
            background: #111;
            border-bottom: 2px solid var(--border);
        }
        .status-bar {
            background: #000;
            padding: 8px 12px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .status-badge {
            color: var(--safe);
            font-weight: bold;
        }
        .controls-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 6px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        .control-name {
            font-weight: bold;
            color: var(--safe);
            font-size: 13px;
        }
        .control-name.tc-type {
            color: var(--accent);
        }
        .control-time {
            font-size: 13px;
            letter-spacing: 1px;
        }
        .control-time.empty {
            color: #444;
        }
    </style>
</head>
<body>

    <div class="status-bar">
        <span class="status-badge" id="live-indicator">LIVE</span>
        <span id="acc-display">ACC: --m</span>
    </div>

    <div id="map"></div>

    <div class="controls-container" id="controls-list">
        </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLi3NMmoJJCeJFGU4d-N4R47D0qM1r8nU",
            authDomain: "the-regulator-rally.firebaseapp.com",
            databaseURL: "https://the-regulator-rally-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "the-regulator-rally",
            storageBucket: "the-regulator-rally.appspot.com",
            messagingSenderId: "1026958520151",
            appId: "1:1026958520151:web:166551b9b18361668f447d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Control schema (TC replaced PC)
        const CONTROL_SCHEMA = [
            { id: "CONTROL 3", type: "CONTROL" },
            { id: "CONTROL 4", type: "CONTROL" },
            { id: "CONTROL 5", type: "CONTROL" },
            { id: "CONTROL 6", type: "CONTROL" },
            { id: "CONTROL 7", type: "CONTROL" },
            { id: "CONTROL 8", type: "CONTROL" },
            { id: "CONTROL 9", type: "CONTROL" },
            { id: "TC 1", type: "TC" },
            { id: "TC 2", type: "TC" },
            { id: "TC 3", type: "TC" }
        ];

        // 1. Initialize Map with OpenStreetMap (Fixes API Key Error)
        const map = L.map('map', { zoomControl: false }).setView([51.505, -0.09], 13);
        
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const marker = L.circleMarker([0, 0], {
            color: '#f1c40f',
            fillColor: '#f1c40f',
            fillOpacity: 0.9,
            radius: 8
        }).addTo(map);

        // 2. Render UI Controls List
        function renderUI(stampData = {}) {
            const container = document.getElementById('controls-list');
            container.innerHTML = '';

            CONTROL_SCHEMA.forEach(ctrl => {
                const rec = stampData[ctrl.id];
                const isTC = ctrl.type === 'TC';
                
                const row = document.createElement('div');
                row.className = 'control-row';
                row.innerHTML = `
                    <span class="control-name ${isTC ? 'tc-type' : ''}">${ctrl.id}</span>
                    <span class="control-time ${rec ? '' : 'empty'}">${rec ? rec.time : '---'}</span>
                `;
                container.appendChild(row);
            });
        }

        renderUI();

        // 3. Geolocation & Sync Setup
        const carID = "CAR_1"; // Adjust car key context as required
        const carRef = ref(db, `GEOSCATTER/${carID}`);

        // Listen for live database updates to update UI timestamps
        onValue(carRef, (snapshot) => {
            const data = snapshot.val() || {};
            renderUI(data);
        });

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    const latLng = [latitude, longitude];
                    
                    marker.setLatLng(latLng);
                    map.panTo(latLng);
                    document.getElementById('acc-display').textContent = `ACC: ${accuracy.toFixed(1)}m`;
                },
                (err) => console.error(err),
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
            );
        }
    </script>
</body>
</html>
