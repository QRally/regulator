<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeoStamp Live Tracker Master</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #050505;
            --card-bg: #111;
            --accent: #f1c40f;
            --text: #eee;
            --safe: #2ecc71;
            --danger: #e74c3c;
            --border: #222;
        }
        * { box-sizing: border-box; }
        body {
            font-family: monospace;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 40vh;
            background: #111;
            border-bottom: 2px solid var(--border);
        }
        .status-bar {
            background: #000;
            padding: 8px 12px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .status-badge {
            color: var(--safe);
            font-weight: bold;
        }
        .controls-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 6px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        .control-name {
            font-weight: bold;
            color: var(--safe);
            font-size: 13px;
        }
        .control-name.tc-type { color: var(--accent); }
        .control-name.start-finish { color: #3498db; }
        .control-time {
            font-size: 13px;
            letter-spacing: 1px;
        }
        .control-time.empty { color: #444; }

        /* Green Confirmation Banner Overlay */
        #stamp-alert {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(46, 204, 113, 0.95);
            color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
        }
        #stamp-alert.active {
            opacity: 1;
            pointer-events: auto;
        }
        #stamp-alert h1 {
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
        }
        #stamp-alert p {
            font-size: 1.2rem;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Confirmation Banner Overlay -->
    <div id="stamp-alert">
        <h1 id="alert-title">STAMP REGISTERED</h1>
        <p id="alert-detail">CONTROL</p>
    </div>

    <div class="status-bar">
        <span class="status-badge" id="live-indicator">LIVE</span>
        <span id="acc-display">ACC: --m</span>
    </div>

    <div id="map"></div>

    <div class="controls-container" id="controls-list">
        <!-- Control items generated dynamically -->
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLi3NMmoJJCeJFGU4d-N4R47D0qM1r8nU",
            authDomain: "the-regulator-rally.firebaseapp.com",
            databaseURL: "https://the-regulator-rally-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "the-regulator-rally",
            storageBucket: "the-regulator-rally.appspot.com",
            messagingSenderId: "1026958520151",
            appId: "1:1026958520151:web:166551b9b18361668f447d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const GEOFENCE_RADIUS_METERS = 30;

        const ROUTE_CONTROLS = [
            { id: "START", type: "START", lat: 52.0000, lng: -4.0000 },
            { id: "CONTROL 3", type: "CONTROL", lat: 52.0050, lng: -4.0020 },
            { id: "CONTROL 4", type: "CONTROL", lat: 52.0100, lng: -4.0040 },
            { id: "CONTROL 5", type: "CONTROL", lat: 52.0150, lng: -4.0060 },
            { id: "CONTROL 6", type: "CONTROL", lat: 52.0200, lng: -4.0080 },
            { id: "CONTROL 7", type: "CONTROL", lat: 52.0250, lng: -4.0100 },
            { id: "CONTROL 8", type: "CONTROL", lat: 52.0300, lng: -4.0120 },
            { id: "CONTROL 9", type: "CONTROL", lat: 52.0350, lng: -4.0140 },
            { id: "TC 1", type: "TC", lat: 52.0400, lng: -4.0160 },
            { id: "TC 2", type: "TC", lat: 52.0450, lng: -4.0180 },
            { id: "TC 3", type: "TC", lat: 52.0500, lng: -4.0200 },
            { id: "TC 4", type: "TC", lat: 52.0550, lng: -4.0220 },
            { id: "FINISH", type: "FINISH", lat: 52.0600, lng: -4.0240 }
        ];

        // Web Audio Context Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeepSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // High pitch tone (A5)
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // Show Green Screen Confirmation
        function triggerConfirmationUI(label, time) {
            playBeepSound();
            const alertBox = document.getElementById('stamp-alert');
            document.getElementById('alert-detail').textContent = `${label} AT ${time}`;
            alertBox.classList.add('active');

            setTimeout(() => {
                alertBox.classList.remove('active');
            }, 2000);
        }

        // Initialize Map
        const map = L.map('map', { zoomControl: false }).setView([52.0000, -4.0000], 12);
        
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        const userMarker = L.circleMarker([0, 0], {
            color: '#f1c40f',
            fillColor: '#f1c40f',
            fillOpacity: 0.9,
            radius: 8
        }).addTo(map);

        ROUTE_CONTROLS.forEach(ctrl => {
            const markerColor = ctrl.type === 'TC' ? '#f1c40f' : (ctrl.type === 'CONTROL' ? '#2ecc71' : '#3498db');
            L.circleMarker([ctrl.lat, ctrl.lng], {
                color: markerColor,
                fillColor: markerColor,
                fillOpacity: 0.4,
                radius: 6
            }).addTo(map).bindPopup(`<b>${ctrl.id}</b><br>${ctrl.type}`);
        });

        let currentStamps = {};
        function renderUI() {
            const container = document.getElementById('controls-list');
            container.innerHTML = '';

            ROUTE_CONTROLS.forEach(ctrl => {
                const rec = currentStamps[ctrl.id];
                let typeClass = '';
                if (ctrl.type === 'TC') typeClass = 'tc-type';
                if (ctrl.type === 'START' || ctrl.type === 'FINISH') typeClass = 'start-finish';
                
                const row = document.createElement('div');
                row.className = 'control-row';
                row.innerHTML = `
                    <span class="control-name ${typeClass}">${ctrl.id}</span>
                    <span class="control-time ${rec ? '' : 'empty'}">${rec ? rec.time : '---'}</span>
                `;
                container.appendChild(row);
            });
        }

        renderUI();

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;
        }

        const carID = "CAR_1";
        const carRef = ref(db, `GEOSCATTER/${carID}`);

        onValue(carRef, (snapshot) => {
            currentStamps = snapshot.val() || {};
            renderUI();
        });

        function checkGeofences(lat, lng) {
            const nowTimeString = new Date().toTimeString().split(' ')[0];

            ROUTE_CONTROLS.forEach(ctrl => {
                if (!currentStamps[ctrl.id]) {
                    const dist = getDistanceMeters(lat, lng, ctrl.lat, ctrl.lng);
                    if (dist <= GEOFENCE_RADIUS_METERS) {
                        const updateData = {};
                        updateData[ctrl.id] = {
                            time: nowTimeString,
                            lat: lat,
                            lng: lng
                        };
                        update(carRef, updateData);
                        triggerConfirmationUI(ctrl.id, nowTimeString);
                    }
                }
            });
        }

        // Enable Audio Context on first touch screen user gesture
        document.body.addEventListener('touchstart', () => {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }, { once: true });

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    const latLng = [latitude, longitude];
                    
                    userMarker.setLatLng(latLng);
                    map.panTo(latLng);
                    document.getElementById('acc-display').textContent = `ACC: ${accuracy.toFixed(1)}m`;

                    checkGeofences(latitude, longitude);
                },
                (err) => console.error(err),
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
            );
        }
    </script>
</body>
</html>
